name: Video poll

on:
  workflow_dispatch:
  schedule:
    # One wake each hour. The shift itself keeps listening for nearly three
    # hours, so a late schedule does not put the bot to sleep. Nothing here
    # starts another workflow.
    - cron: "57 * * * *"

permissions:
  contents: write

concurrency:
  group: video-poll
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCH_SECONDS: "9600"
        run: python bot.py --watch
      - name: Heartbeat
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git pull --rebase origin main || true
          date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          git add .heartbeat
          if ! git diff --cached --quiet; then
            git commit -m "Heartbeat" || true
          fi
          git pull --rebase origin main || true
          git push origin HEAD:main || true
