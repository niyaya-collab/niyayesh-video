name: Video poll

on:
  workflow_dispatch:
  schedule:
    - cron: "14,34,54 * * * *"

permissions:
  contents: write

concurrency:
  group: video-poll
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCH_SECONDS: "1140"
        run: python bot.py --watch